<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>Fuel Route Planner</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <style>
    :root {
      --bg: #f5f7fb;
      --card: #ffffff;
      --ink: #1b2333;
      --muted: #6b7587;
      --line: #e3e8f0;
      --brand: #2f6bff;
      --brand-dark: #1f4fd1;
      --good: #14935a;
      --warn: #d9480f;
      --radius: 14px;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      color: var(--ink);
      background: var(--bg);
    }
    .app { display: flex; height: 100%; }

    /* ---------- side panel ---------- */
    .panel {
      width: 400px; max-width: 100%;
      background: var(--bg);
      overflow-y: auto;
      padding: 20px;
      border-right: 1px solid var(--line);
    }
    .brand { display: flex; align-items: center; gap: 10px; margin-bottom: 4px; }
    .logo {
      width: 36px; height: 36px; border-radius: 10px;
      background: var(--brand); color: #fff;
      display: grid; place-items: center; font-size: 18px;
    }
    h1 { font-size: 20px; margin: 0; letter-spacing: -0.2px; }
    .sub { color: var(--muted); font-size: 13px; margin: 6px 0 18px; line-height: 1.4; }

    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 14px;
      box-shadow: 0 1px 2px rgba(20, 30, 60, 0.04);
    }
    label { display: block; font-size: 12px; font-weight: 600; color: var(--muted); margin: 0 0 5px; }
    .field { position: relative; margin-bottom: 10px; }
    .field input {
      width: 100%; padding: 11px 12px; font-size: 14px;
      border: 1px solid var(--line); border-radius: 10px;
      background: #fbfcfe; color: var(--ink);
      outline: none; transition: border-color .15s, box-shadow .15s;
    }
    .field input:focus { border-color: var(--brand); box-shadow: 0 0 0 3px rgba(47, 107, 255, .15); }
    .swap-row { display: flex; justify-content: center; margin: -4px 0 6px; }
    .swap {
      border: 1px solid var(--line); background: #fff; color: var(--muted);
      border-radius: 999px; width: 30px; height: 30px; cursor: pointer; font-size: 15px;
    }
    .swap:hover { color: var(--brand); border-color: var(--brand); }

    .go {
      width: 100%; padding: 12px; margin-top: 4px;
      border: 0; border-radius: 10px; cursor: pointer;
      background: var(--brand); color: #fff; font-size: 15px; font-weight: 600;
      display: flex; align-items: center; justify-content: center; gap: 8px;
      transition: background .15s;
    }
    .go:hover { background: var(--brand-dark); }
    .go:disabled { opacity: .7; cursor: wait; }
    .spinner {
      width: 16px; height: 16px; border-radius: 50%;
      border: 2px solid rgba(255,255,255,.4); border-top-color: #fff;
      animation: spin .7s linear infinite; display: none;
    }
    .loading .spinner { display: inline-block; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
    .chip {
      border: 1px solid var(--line); background: #fff; color: var(--ink);
      font-size: 12px; padding: 5px 10px; border-radius: 999px; cursor: pointer;
    }
    .chip:hover { border-color: var(--brand); color: var(--brand); }
    .chips-title { font-size: 12px; color: var(--muted); margin: 14px 0 0; }

    .error {
      display: none; margin-top: 14px; padding: 12px 14px; border-radius: 10px;
      background: #fff3ef; border: 1px solid #ffd0c2; color: var(--warn); font-size: 14px;
    }

    /* ---------- results ---------- */
    #results { display: none; margin-top: 16px; }
    .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .stat { padding: 12px 14px; }
    .stat .k { font-size: 11px; text-transform: uppercase; letter-spacing: .5px; color: var(--muted); }
    .stat .v { font-size: 22px; font-weight: 700; margin-top: 2px; }
    .stat.total { grid-column: 1 / -1; background: var(--brand); border-color: var(--brand); color: #fff; }
    .stat.total .k { color: rgba(255,255,255,.8); }
    .stat.total .v { font-size: 30px; }
    .timing { font-size: 12px; color: var(--muted); margin: 10px 2px 0; }

    h2 { font-size: 14px; margin: 18px 2px 8px; }
    .stop {
      display: flex; gap: 12px; padding: 12px; margin-bottom: 8px; cursor: pointer;
      transition: border-color .15s, transform .1s;
    }
    .stop:hover { border-color: var(--brand); transform: translateY(-1px); }
    .badge {
      flex: 0 0 auto; width: 28px; height: 28px; border-radius: 50%;
      background: #c0392b; color: #fff; display: grid; place-items: center;
      font-size: 13px; font-weight: 700;
    }
    .stop .name { font-weight: 600; font-size: 14px; }
    .stop .where { font-size: 12px; color: var(--muted); margin-top: 1px; }
    .stop .math { font-size: 13px; margin-top: 6px; }
    .stop .math b { color: var(--good); }
    .nostops { padding: 14px; font-size: 14px; color: var(--muted); }

    /* ---------- map ---------- */
    .map-wrap { flex: 1; position: relative; }
    #map { position: absolute; inset: 0; }
    .pin {
      width: 26px; height: 26px; border-radius: 50%; color: #fff;
      display: grid; place-items: center; font-size: 12px; font-weight: 700;
      border: 3px solid #fff; box-shadow: 0 2px 6px rgba(0,0,0,.35);
    }
    .pin.start { background: var(--good); }
    .pin.finish { background: #1b2333; }
    .pin.stop { background: #c0392b; }

    @media (max-width: 800px) {
      .app { flex-direction: column-reverse; }
      .panel { width: 100%; height: 55%; border-right: 0; border-top: 1px solid var(--line); }
      .map-wrap { flex: 0 0 45%; }
    }
  </style>
</head>
<body>
  <div class="app">
    <aside class="panel">
      <div class="brand">
        <div class="logo">&#9981;</div>
        <h1>Fuel Route Planner</h1>
      </div>
      <p class="sub">Enter two places in the USA. We find the cheapest fuel stops along the way for a car with a 500-mile range and 10 mpg.</p>

      <form id="form" class="card" autocomplete="off">
        <div class="field">
          <label for="start">From</label>
          <input id="start" value="Chicago, IL" placeholder="e.g. Chicago, IL">
        </div>
        <div class="swap-row"><button type="button" class="swap" id="swap" title="Swap start and finish">&#8645;</button></div>
        <div class="field">
          <label for="finish">To</label>
          <input id="finish" value="Dallas, TX" placeholder="e.g. Dallas, TX">
        </div>
        <button class="go" id="go" type="submit"><span class="spinner"></span><span id="gotext">Plan route</span></button>

        <p class="chips-title">Try an example</p>
        <div class="chips" id="chips"></div>
      </form>

      <div class="error" id="error"></div>

      <section id="results">
        <div class="stats">
          <div class="card stat total"><div class="k">Total fuel cost</div><div class="v" id="s-cost"></div></div>
          <div class="card stat"><div class="k">Distance</div><div class="v" id="s-dist"></div></div>
          <div class="card stat"><div class="k">Fuel stops</div><div class="v" id="s-stops"></div></div>
          <div class="card stat"><div class="k">Fuel bought</div><div class="v" id="s-gal"></div></div>
          <div class="card stat"><div class="k">Avg price</div><div class="v" id="s-avg"></div></div>
        </div>
        <div class="timing" id="timing"></div>
        <h2>Fuel stops</h2>
        <div id="stops"></div>
      </section>
    </aside>

    <main class="map-wrap"><div id="map"></div></main>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    // ---------- map setup ----------
    const map = L.map('map', { zoomControl: false }).setView([39.5, -98.35], 4);
    L.control.zoom({ position: 'bottomright' }).addTo(map);

    const osm = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      referrerPolicy: 'strict-origin-when-cross-origin',
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
    }).addTo(map);
    const esri = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}', {
      maxZoom: 18,
      attribution: 'Tiles &copy; Esri, HERE, Garmin, USGS, &copy; OpenStreetMap contributors'
    });
    L.control.layers({ 'OpenStreetMap': osm, 'Esri Streets': esri }, null, { position: 'topright' }).addTo(map);

    const layer = L.layerGroup().addTo(map);
    const markers = {};

    // ---------- helpers ----------
    const $ = id => document.getElementById(id);
    const money = n => '$' + Number(n).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const pin = (cls, text) => L.divIcon({
      className: '', html: '<div class="pin ' + cls + '">' + text + '</div>',
      iconSize: [26, 26], iconAnchor: [13, 13], popupAnchor: [0, -12]
    });

    // ---------- example routes ----------
    const examples = [
      ['Chicago, IL', 'Dallas, TX'],
      ['New York, NY', 'Los Angeles, CA'],
      ['Seattle, WA', 'Denver, CO'],
      ['Miami, FL', 'Atlanta, GA'],
    ];
    examples.forEach(([a, b]) => {
      const chip = document.createElement('button');
      chip.type = 'button';
      chip.className = 'chip';
      chip.textContent = a.split(',')[0] + ' \u2192 ' + b.split(',')[0];
      chip.onclick = () => { $('start').value = a; $('finish').value = b; plan(); };
      $('chips').appendChild(chip);
    });

    $('swap').onclick = () => {
      const t = $('start').value;
      $('start').value = $('finish').value;
      $('finish').value = t;
    };

    // ---------- main action ----------
    $('form').addEventListener('submit', e => { e.preventDefault(); plan(); });

    async function plan() {
      const go = $('go');
      $('error').style.display = 'none';
      go.disabled = true;
      go.classList.add('loading');
      $('gotext').textContent = 'Planning...';

      try {
        const qs = new URLSearchParams({ start: $('start').value, finish: $('finish').value });
        const res = await fetch('/api/route/?' + qs);
        const data = await res.json();
        if (!res.ok) {
          const msg = data.error || Object.values(data).flat().join(' ') || 'Something went wrong.';
          showError(msg);
          return;
        }
        show(data);
      } catch (err) {
        showError('Could not reach the server. Is it running?');
      } finally {
        go.disabled = false;
        go.classList.remove('loading');
        $('gotext').textContent = 'Plan route';
      }
    }

    function showError(msg) {
      const box = $('error');
      box.textContent = msg;
      box.style.display = 'block';
    }

    function show(data) {
      layer.clearLayers();
      Object.keys(markers).forEach(k => delete markers[k]);

      const line = L.geoJSON(data.route, { style: { color: '#2f6bff', weight: 5, opacity: 0.85 } }).addTo(layer);
      map.fitBounds(line.getBounds(), { padding: [40, 40] });

      L.marker([data.start.lat, data.start.lon], { icon: pin('start', 'A') })
        .bindPopup('<b>Start</b><br>' + esc(data.start.label)).addTo(layer);
      L.marker([data.finish.lat, data.finish.lon], { icon: pin('finish', 'B') })
        .bindPopup('<b>Finish</b><br>' + esc(data.finish.label)).addTo(layer);

      data.fuel_stops.forEach(s => {
        markers[s.stop] = L.marker([s.lat, s.lon], { icon: pin('stop', s.stop) })
          .bindPopup(
            '<b>' + esc(s.name) + '</b><br>' + esc(s.city) + ', ' + esc(s.state) + '<br>' +
            'Mile ' + s.miles_from_start + '<br>' +
            s.gallons + ' gal @ $' + s.price_per_gallon + ' = ' + money(s.cost)
          ).addTo(layer);
      });

      // summary cards
      $('s-cost').textContent = money(data.total_fuel_cost);
      $('s-dist').textContent = Number(data.distance_miles).toLocaleString('en-US') + ' mi';
      $('s-stops').textContent = data.fuel_stops.length;
      $('s-gal').textContent = data.total_gallons + ' gal';
      $('s-avg').textContent = data.total_gallons > 0
        ? '$' + (data.total_fuel_cost / data.total_gallons).toFixed(3) + '/gal'
        : '\u2014';
      $('timing').textContent = 'Computed in ' + (data.elapsed_ms / 1000).toFixed(2) + ' s. Starting tank assumed full.';

      // stop list
      const list = $('stops');
      list.innerHTML = '';
      if (data.fuel_stops.length === 0) {
        list.innerHTML = '<div class="card nostops">No fuel stop needed. This trip is within the 500-mile range of a full tank.</div>';
      }
      data.fuel_stops.forEach(s => {
        const el = document.createElement('div');
        el.className = 'card stop';
        el.innerHTML =
          '<div class="badge">' + s.stop + '</div>' +
          '<div>' +
            '<div class="name">' + esc(s.name) + '</div>' +
            '<div class="where">' + esc(s.city) + ', ' + esc(s.state) + ' &middot; mile ' + s.miles_from_start + '</div>' +
            '<div class="math">' + s.gallons + ' gal &times; $' + s.price_per_gallon + ' = <b>' + money(s.cost) + '</b></div>' +
          '</div>';
        el.onclick = () => {
          map.flyTo([s.lat, s.lon], 9, { duration: 0.8 });
          markers[s.stop].openPopup();
        };
        list.appendChild(el);
      });

      $('results').style.display = 'block';
      $('results').scrollIntoView({ behavior: 'smooth', block: 'start' });
    }
  </script>
</body>
</html>
